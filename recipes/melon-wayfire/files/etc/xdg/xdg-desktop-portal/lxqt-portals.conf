# Portals in melon's desktop (LXQt on Wayfire): LXQt's file dialogs for Flatpak apps, and the wlroots portal for
# screenshots and screen sharing (browsers, OBS, video calls), which LXQt's portal doesn't do.
[preferred]
default=lxqt
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
