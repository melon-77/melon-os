# vmwgfx drives the VMware SVGA adapter. VirtualBox's default "VMSVGA" adapter and QEMU's vmware-svga
# pretend to be that adapter too, and there vmwgfx can switch off the boot console and then fail to
# probe, which leaves the screen frozen. So it is only loaded on real VMware (see /etc/runit/1);
# elsewhere the firmware framebuffer (simpledrm) keeps the screen working.
blacklist vmwgfx
