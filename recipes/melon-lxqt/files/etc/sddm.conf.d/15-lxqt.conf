# melon-lxqt: the login screen runs on labwc instead of KWin (the 32-bit edition has no Plasma).
# The greeter is a normal window there that labwc shows full screen (/usr/share/melon/sddm-labwc/rc.xml): as a
# layer-shell surface (10-melon.conf, for KWin) labwc drew it as a tiny box on a black screen.
# melon-desktop's 10-melon.conf keeps the rest (Wayland greeter, melon theme).
[General]
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=xdg-shell

[Wayland]
CompositorCommand=labwc -C /usr/share/melon/sddm-labwc
