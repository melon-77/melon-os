# Nix's settings: see "man nix.conf" or https://nix.dev/manual/nix/latest/command-ref/conf-file
# melon runs Nix as a daemon (the nix-daemon service); builds run as the nixbld users, in a sandbox.
build-users-group = nixbld
sandbox = true
max-jobs = auto
# flakes and the nix command (Home Manager's standard setup uses both)
experimental-features = nix-command flakes
# Only root is trusted. A trusted user is effectively root: they can set options that run commands as root in the
# daemon (post-build-hook) or add their own binary caches. To trust yourself anyway, add your name here.
trusted-users = root
