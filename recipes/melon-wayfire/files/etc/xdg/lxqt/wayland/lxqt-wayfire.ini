# melon's Wayfire: the compositor of melon's default desktop (LXQt's panel, launcher, notifications and file manager on top).
# startlxqtwayland copies this file to ~/.config/lxqt/wayland/lxqt-wayfire.ini on your first login: change that copy.
# Every option: https://github.com/WayfireWM/wayfire/wiki/Configuration
# Colours are melon's palette as red green blue alpha (0 to 1): dark #121714 and #1b221d, text #e6ece3, accent #6fbf4a.

[input]
xkb_layout =
xkb_variant =
xkb_options =
cursor_size = 24
cursor_theme = default
natural_scroll = false
tap_to_click = true
mouse_accel_profile = default

[core]
# few effects, all quick: a fade when windows open and close, nothing that wobbles or spins
plugins = \
  animate \
  autostart \
  command \
  decoration \
  expo \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  move \
  oswitch \
  place \
  resize \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wsets \
  xdg-activation \
  zoom
close_top_view = <super> KEY_Q | <alt> KEY_F4
# two workspaces side by side (Ctrl+Super+Left/Right; Super+E shows both)
vwidth = 2
vheight = 1
preferred_decoration_mode = server
background_color = 0.071 0.090 0.078 1.0
xwayland = true

# title bars: dark and plain, the accent only marks the window you are typing into
[decoration]
font = Noto Sans
font_color = 0.902 0.925 0.890 1.0
title_height = 28
border_size = 1
button_order = minimize maximize close
active_color = 0.106 0.133 0.114 1.0
inactive_color = 0.071 0.090 0.078 1.0

[animate]
open_animation = fade
close_animation = fade
duration = 160
startup_duration = 0

[place]
mode = center

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[zoom]
modifier = <super> <alt>

# the panel, file manager desktop (wallpaper), notifications and the rest are LXQt's session; Wayfire ends with it
[autostart]
autostart_wf_shell = false
env = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
session = lxqt-session && killall wayfire
# lock after 10 minutes without input and before the computer sleeps
idle = swayidle -w timeout 600 'swaylock -f' before-sleep 'swaylock -f'

# screens off after 15 minutes; no screensaver animation
[idle]
toggle = <super> KEY_Z
screensaver_timeout = -1
dpms_timeout = 900
disable_on_fullscreen = true

[command]
binding_terminal = <super> KEY_ENTER | <ctrl> <alt> KEY_T
command_terminal = qterminal
binding_launcher = <alt> KEY_SPACE | <alt> KEY_F2
command_launcher = lxqt-runner
binding_menu = <super>
command_menu = lxqt-qdbus openmenu
binding_filemanager = <super> KEY_E
command_filemanager = pcmanfm-qt
binding_lock = <super> KEY_L
command_lock = swaylock -f
binding_logout = <super> KEY_ESC | <ctrl> <alt> KEY_DELETE
command_logout = lxqt-leave
binding_leave = KEY_POWER
command_leave = lxqt-leave
binding_showdesktop = <super> KEY_D
command_showdesktop = lxqt-qdbus showdesktop
binding_screenshot = KEY_PRINT | KEY_SYSRQ
command_screenshot = melon-screenshot
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = lxqt-qdbus volume up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = lxqt-qdbus volume down
binding_mute = KEY_MUTE
command_mute = lxqt-qdbus volume mute
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = lxqt-config-brightness -i
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = lxqt-config-brightness -d

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_T
minimize = <super> KEY_H

# half and quarter screen with Super and the arrows or the keypad
[grid]
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
restore = <super> KEY_DOWN | <super> KEY_KP0

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_ESC

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

[expo]
toggle = <super> KEY_W
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O
