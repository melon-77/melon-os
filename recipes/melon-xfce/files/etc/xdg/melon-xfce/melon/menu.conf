# melon-menu's pinned apps (desktop IDs, in order). Right click an app in the menu to pin or unpin it; that writes
# ~/.config/melon/menu.conf, which then wins over this file. Apps that aren't installed are skipped.
[menu]
pinned=org.mozilla.firefox.desktop;thunar.desktop;xfce4-terminal.desktop;org.xfce.mousepad.desktop;org.videolan.VLC.desktop;com.valvesoftware.Steam.desktop;org.xfce.ristretto.desktop;xfce-settings-manager.desktop;org.gnome.Software.desktop;xfce4-taskmanager.desktop;org.xfce.Parole.desktop;melon-pinball.desktop;
