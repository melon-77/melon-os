# melon's Calamares: welcome -> the gauntlet (200 questions) -> disks -> you -> summary -> install.
# melon is US English / UTC by default, so there are no locale or keyboard pages; Plasma's settings
# change both after the install.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: prepare
  module: shellprocess
  config: shellprocess-prepare.conf
- id: finish
  module: shellprocess
  config: shellprocess-finish.conf
- id: alpine
  module: contextualprocess
  config: contextualprocess-alpine.conf

sequence:
- show:
  - welcome
  - gauntlet
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfsc
  - shellprocess@prepare
  - users
  - shellprocess@finish
  - contextualprocess@alpine
  - umount
- show:
  - finished

branding: melon
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
