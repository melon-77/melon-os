# Nix's settings: see "man nix.conf" or https://nix.dev/manual/nix/latest/command-ref/conf-file
# melon runs Nix as a daemon (the nix-daemon service); builds run as the nixbld users, in a sandbox.
build-users-group = nixbld
sandbox = true
max-jobs = auto
# flakes and the nix command (Home Manager's standard setup uses both)
experimental-features = nix-command flakes
# members of wheel may use extra binary caches and settings (they can use doas anyway)
trusted-users = root @wheel
