# Layout on an erased disk:
#   UEFI: EFI system partition (/boot/efi, FAT32) + /boot (FAT32, 1 GiB) + / (XFS)
#   BIOS: MBR with /boot (FAT32, 1 GiB, bootable) + / (XFS)
# /boot stays unencrypted, so "Encrypt system" (LUKS) works on both: the kernel and the small unlock
# initramfs live there. Swap is a swap file plus zram, made by the finishing job.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 64MiB
    label: "EFI"
userSwapChoices: [ none ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
# no preselected choice: next to Windows, "Install alongside" (shrink) and "Erase disk" are one click apart
initialPartitioningChoice: none
defaultFileSystemType: "xfs"
availableFileSystemTypes: [ "xfs", "ext4" ]
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
partitionLayout:
    - name: "melonboot"
      filesystem: "fat32"
      mountPoint: "/boot"
      size: 1GiB
    - name: "melon"
      filesystem: "xfs"
      mountPoint: "/"
      size: 100%
      minSize: 12GiB
